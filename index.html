<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yon Daftar Messenger</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f2f2;
    }

    .app {
      max-width: 500px;
      height: 100vh;
      margin: auto;
      background: white;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: #075e54;
      color: white;
      padding: 15px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #ddd;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #555;
      font-weight: bold;
    }

    .user-info {
      flex: 1;
    }

    .user-name {
      font-size: 17px;
      font-weight: bold;
    }

    .status {
      font-size: 12px;
      opacity: 0.85;
      margin-top: 3px;
    }

    .chat {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
      background: #e5ddd5;
    }

    .message {
      max-width: 78%;
      padding: 9px 10px;
      margin-bottom: 10px;
      border-radius: 10px;
      word-wrap: break-word;
    }

    .received {
      background: white;
      margin-right: auto;
    }

    .sent {
      background: #dcf8c6;
      margin-left: auto;
    }

    .message-time {
      font-size: 10px;
      color: #777;
      text-align: right;
      margin-top: 4px;
    }

    .checks {
      margin-left: 4px;
      font-weight: bold;
    }

    .read {
      color: #1687d9;
    }

    .bottom {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px;
      background: #f0f0f0;
    }

    .message-input {
      flex: 1;
      border: none;
      outline: none;
      padding: 12px 15px;
      border-radius: 22px;
      font-size: 15px;
    }

    button {
      border: none;
      cursor: pointer;
    }

    .send {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      background: #075e54;
      color: white;
      font-size: 19px;
    }

    .mic {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: transparent;
      font-size: 20px;
    }

    .login {
      position: fixed;
      inset: 0;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
    }

    .login-box {
      width: 100%;
      max-width: 360px;
    }

    .login-box h1 {
      text-align: center;
      margin-bottom: 25px;
    }

    .login-box input {
      width: 100%;
      padding: 13px;
      margin-bottom: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      outline: none;
    }

    .login-btn,
    .register-btn {
      width: 100%;
      padding: 13px;
      color: white;
      border-radius: 8px;
      font-size: 16px;
    }

    .login-btn {
      background: #075e54;
    }

    .register-btn {
      margin-top: 10px;
      background: #128c7e;
    }

    .logout-btn {
      display: none;
      position: fixed;
      top: 10px;
      right: 10px;
      z-index: 10;
      padding: 8px 12px;
      background: #c62828;
      color: white;
      border-radius: 6px;
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="header">
      <div class="avatar">A</div>

      <div class="user-info">
        <div class="user-name" id="userName">@anor_user</div>
        <div class="status" id="userStatus">offline</div>
      </div>

      <div>⋮</div>
    </div>

    <div class="chat" id="chat">

      <div class="message received">
        Salom 👋
        <div class="message-time">
          08:20
        </div>
      </div>

    </div>

    <div class="bottom">

      <button class="mic" onclick="voiceMessage()">🎙️</button>

      <input
        id="messageInput"
        class="message-input"
        type="text"
        placeholder="Xabar yozing..."
        onkeydown="if(event.key === 'Enter') sendMessage()"
      >

      <button class="send" onclick="sendMessage()">➤</button>

    </div>

  </div>

  <button
    class="logout-btn"
    id="logoutBtn"
    onclick="logoutUser()">
    Chiqish
  </button>

  <div class="login" id="login">

    <div class="login-box">

      <h1>Yon Daftar</h1>

      <input
        id="username"
        type="email"
        placeholder="Email"
      >

      <input
        id="password"
        type="password"
        placeholder="Parol"
      >

      <button
        class="login-btn"
        onclick="loginUser()">
        Kirish
      </button>

      <button
        class="register-btn"
        onclick="registerUser()">
        Ro‘yxatdan o‘tish
      </button>

    </div>

  </div>

  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

    import {
      getAuth,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      signOut,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


    const firebaseConfig = {
      apiKey: "AIzaSyAgrmLZC5WvlGRfdAK4HqXBHX6Ro-qpbrk",
      authDomain: "yon-daftar.firebaseapp.com",
      projectId: "yon-daftar",
      storageBucket: "yon-daftar.firebasestorage.app",
      messagingSenderId: "33642502137",
      appId: "1:33642502137:web:f98749cc00e416a9be8f28",
      measurementId: "G-0GJBQ4LHPH"
    };


    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);


    window.registerUser = async function() {

      const email =
        document.getElementById("username").value.trim();

      const password =
        document.getElementById("password").value.trim();


      if (!email || !password) {
        alert("Email va parolni kiriting.");
        return;
      }


      try {

        await createUserWithEmailAndPassword(
          auth,
          email,
          password
        );

        alert("Ro‘yxatdan o‘tish muvaffaqiyatli!");

      } catch (error) {

        alert("Xatolik: " + error.message);

      }

    };


    window.loginUser = async function() {

      const email =
        document.getElementById("username").value.trim();

      const password =
        document.getElementById("password").value.trim();


      if (!email || !password) {
        alert("Email va parolni kiriting.");
        return;
      }


      try {

        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

      } catch (error) {

        alert("Kirishda xatolik: " + error.message);

      }

    };


    window.logoutUser = async function() {

      try {

        await signOut(auth);

      } catch (error) {

        alert("Chiqishda xatolik: " + error.message);

      }

    };


    onAuthStateChanged(auth, (user) => {

      const login =
        document.getElementById("login");

      const logoutBtn =
        document.getElementById("logoutBtn");

      const userName =
        document.getElementById("userName");

      const userStatus =
        document.getElementById("userStatus");


      if (user) {

        login.style.display = "none";

        logoutBtn.style.display = "block";

        userName.textContent =
          user.email;

        userStatus.textContent =
          "online";

      } else {

        login.style.display = "flex";

        logoutBtn.style.display = "none";

        userName.textContent =
          "@anor_user";

        userStatus.textContent =
          "offline";

      }

    });


    window.sendMessage = function() {

      const input =
        document.getElementById("messageInput");

      const text =
        input.value.trim();


      if (text === "") {
        return;
      }


      const chat =
        document.getElementById("chat");


      const message =
        document.createElement("div");

      message.className =
        "message sent";


      const time =
        new Date();

      const hours =
        String(time.getHours()).padStart(2, "0");

      const minutes =
        String(time.getMinutes()).padStart(2, "0");


      message.innerHTML = `
        ${escapeHTML(text)}

        <div class="message-time">
          ${hours}:${minutes}
          <span class="checks">✓</span>
        </div>
      `;


      chat.appendChild(message);

      input.value = "";

      chat.scrollTop =
        chat.scrollHeight;


      setTimeout(() => {

        const checks =
          message.querySelector(".checks");

        if (checks) {
          checks.textContent = "✓✓";
          checks.classList.add("read");
        }

      }, 1500);

    };


    window.escapeHTML = function(text) {

      const div =
        document.createElement("div");

      div.textContent =
        text;

      return div.innerHTML;

    };


    window.voiceMessage = function() {

      alert(
        "🎙️ Ovozli xabar funksiyasi keyingi bosqichda ulanadi."
      );

    };

  </script>

</body>
</html>
