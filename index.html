<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Yon Daftar</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f2f2;
    }

    .app {
      max-width: 500px;
      min-height: 100vh;
      margin: auto;
      background: white;
      padding: 20px;
    }

    h1 {
      margin-top: 0;
    }

    textarea,
    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
      margin-bottom: 10px;
    }

    textarea {
      min-height: 150px;
      resize: vertical;
    }

    button {
      border: none;
      border-radius: 9px;
      padding: 12px 15px;
      font-size: 15px;
      cursor: pointer;
      margin: 4px 2px;
    }

    .save {
      background: #075e54;
      color: white;
    }

    .search {
      background: #128c7e;
      color: white;
    }

    .backup {
      background: #555;
      color: white;
    }

    .delete {
      background: #c62828;
      color: white;
    }

    .login {
      position: fixed;
      inset: 0;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
      z-index: 100;
    }

    .login-box {
      width: 100%;
      max-width: 360px;
    }

    .login-box h2 {
      text-align: center;
      margin-bottom: 25px;
    }

    .login-btn {
      width: 100%;
      background: #075e54;
      color: white;
    }

    .register-btn {
      width: 100%;
      background: #128c7e;
      color: white;
    }

    .logout {
      background: #c62828;
      color: white;
    }

    .account {
      background: #f0f0f0;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 15px;
      font-size: 14px;
    }

    .note {
      background: #f7f7f7;
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 12px;
      margin-top: 10px;
      white-space: pre-wrap;
    }

    .time {
      font-size: 11px;
      color: #777;
      margin-top: 8px;
    }
  </style>
</head>

<body>

  <div class="app">

    <h1>📒 Yon Daftar</h1>

    <div class="account">
      👤 <span id="userEmail">Yuklanmoqda...</span>
      <button class="logout" onclick="logoutUser()">Chiqish</button>
    </div>

    <textarea
      id="noteInput"
      placeholder="Bu yerga yozing..."
    ></textarea>

    <button class="save" onclick="saveNote()">💾 Saqlash</button>

    <br>

    <input
      id="searchInput"
      type="text"
      placeholder="🔍 Daftardan qidiring..."
      oninput="showNotes()"
    >

    <button class="backup" onclick="backupNotes()">📤 Zaxira olish</button>

    <button class="backup" onclick="restoreNotes()">📥 Zaxirani tiklash</button>

    <p>
      Jami: <b id="total">0</b> ta yozuv
    </p>

    <button class="delete" onclick="deleteAllNotes()">
      🗑 Hammasini o‘chirish
    </button>

    <div id="notes"></div>

  </div>


  <!-- Firebase login -->

  <div class="login" id="login">

    <div class="login-box">

      <h2>📒 Yon Daftar</h2>

      <input
        id="email"
        type="email"
        placeholder="Email"
      >

      <input
        id="password"
        type="password"
        placeholder="Parol"
      >

      <button class="login-btn" onclick="loginUser()">
        Kirish
      </button>

      <button class="register-btn" onclick="registerUser()">
        Ro‘yxatdan o‘tish
      </button>

    </div>

  </div>


  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

    import {
      getAuth,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      signOut,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


    const firebaseConfig = {
      apiKey: "AIzaSyAgrmLZC5WvlGRfdAK4HqXBHX6Ro-qpbrk",
      authDomain: "yon-daftar.firebaseapp.com",
      projectId: "yon-daftar",
      storageBucket: "yon-daftar.firebasestorage.app",
      messagingSenderId: "33642502137",
      appId: "1:33642502137:web:f98749cc00e416a9be8f28",
      measurementId: "G-0GJBQ4LHPH"
    };


    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);


    window.registerUser = async function() {

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value.trim();

      if (!email || !password) {
        alert("Email va parolni kiriting.");
        return;
      }

      try {

        await createUserWithEmailAndPassword(
          auth,
          email,
          password
        );

        alert("Ro‘yxatdan o‘tish muvaffaqiyatli!");

      } catch (error) {

        alert("Xatolik: " + error.message);

      }

    };


    window.loginUser = async function() {

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value.trim();

      if (!email || !password) {
        alert("Email va parolni kiriting.");
        return;
      }

      try {

        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );

      } catch (error) {

        alert("Kirishda xatolik: " + error.message);

      }

    };


    window.logoutUser = async function() {

      await signOut(auth);

    };


    onAuthStateChanged(auth, (user) => {

      const login =
        document.getElementById("login");

      const userEmail =
        document.getElementById("userEmail");


      if (user) {

        login.style.display = "none";

        userEmail.textContent =
          user.email;

        showNotes();

      } else {

        login.style.display = "flex";

        userEmail.textContent =
          "Kirish kerak";

      }

    });


    function getNotes() {

      const user =
        auth.currentUser;

      if (!user) return [];

      const key =
        "yon_daftar_notes_" + user.uid;

      return JSON.parse(
        localStorage.getItem(key) || "[]"
      );

    }


    function setNotes(notes) {

      const user =
        auth.currentUser;

      if (!user) return;

      const key =
        "yon_daftar_notes_" + user.uid;

      localStorage.setItem(
        key,
        JSON.stringify(notes)
      );

    }


    window.saveNote = function() {

      const input =
        document.getElementById("noteInput");

      const text =
        input.value.trim();

      if (!text) {

        alert("Avval yozuv kiriting.");

        return;

      }

      const notes =
        getNotes();

      notes.unshift({

        text: text,

        time: new Date().toLocaleString("uz-UZ")

      });

      setNotes(notes);

      input.value = "";

      showNotes();

    };


    window.showNotes = function() {

      const notes =
        getNotes();

      const search =
        document
          .getElementById("searchInput")
          .value
          .toLowerCase()
          .trim();

      const filtered =
        notes.filter(note =>
          note.text.toLowerCase().includes(search)
        );

      const notesBox =
        document.getElementById("notes");

      const total =
        document.getElementById("total");

      total.textContent =
        notes.length;

      notesBox.innerHTML = "";

      if (filtered.length === 0) {

        notesBox.innerHTML =
          "<p>📒 Hozircha yozuv yo‘q</p>";

        return;

      }

      filtered.forEach(note => {

        const div =
          document.createElement("div");

        div.className = "note";

        div.textContent =
          note.text;

        const time =
          document.createElement("div");

        time.className = "time";

        time.textContent =
          note.time;

        div.appendChild(time);

        notesBox.appendChild(div);

      });

    };


    window.deleteAllNotes = function() {

      if (!confirm("Barcha yozuvlar o‘chirilsinmi?")) {
        return;
      }

      setNotes([]);

      showNotes();

    };


    window.backupNotes = function() {

      const notes =
        getNotes();

      const file =
        new Blob(
          [JSON.stringify(notes, null, 2)],
          { type: "application/json" }
        );

      const url =
        URL.createObjectURL(file);

      const a =
        document.createElement("a");

      a.href = url;

      a.download =
        "yon-daftar-zaxira.json";

      a.click();

      URL.revokeObjectURL(url);

    };


    window.restoreNotes = function() {

      const input =
        document.createElement("input");

      input.type = "file";

      input.accept =
        ".json";

      input.onchange = function(event) {

        const file =
          event.target.files[0];

        if (!file) return;

        const reader =
          new FileReader();

        reader.onload = function() {

          try {

            const notes =
              JSON.parse(reader.result);

            if (!Array.isArray(notes)) {
              throw new Error();
            }

            setNotes(notes);

            showNotes();

            alert("Zaxira tiklandi.");

          } catch {

            alert("Zaxira fayli noto‘g‘ri.");

          }

        };

        reader.readAsText(file);

      };

      input.click();

    };

  </script>

</body>
</html>
