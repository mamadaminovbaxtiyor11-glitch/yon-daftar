<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1976d2">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Yon Daftar</title>
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    :root{--bg:#f4f6f8;--card:#fff;--text:#222;--muted:#777;--border:#d7d7d7;--primary:#1976d2;--primary-dark:#125ca8;--danger:#e53935;--edit:#ff9800;--input-bg:#fff;--shadow:0 3px 12px rgba(0,0,0,.08)}
    body.dark{--bg:#121212;--card:#1e1e1e;--text:#f5f5f5;--muted:#aaa;--border:#444;--input-bg:#1e1e1e;--shadow:0 3px 12px rgba(0,0,0,.3)}
    html,body{margin:0;padding:0;min-height:100%}
    body{font-family:Arial,sans-serif;background:var(--bg);color:var(--text);transition:.2s}
    button,input,textarea{font-family:inherit} button{appearance:none}
    header{background:var(--primary);color:#fff;padding:18px 55px 18px 15px;text-align:center;position:relative;box-shadow:0 2px 8px rgba(0,0,0,.15)}
    header h1{margin:0;font-size:26px}.theme-button{position:absolute;right:12px;top:11px;width:42px;height:42px;border:0;border-radius:50%;background:rgba(255,255,255,.18);color:#fff;font-size:20px;cursor:pointer}
    .container{width:100%;max-width:680px;margin:auto;padding:18px 15px 35px}
    textarea{display:block;width:100%;min-height:155px;padding:15px;border:1px solid var(--border);border-radius:14px;outline:0;resize:vertical;background:var(--input-bg);color:var(--text);font-size:17px;line-height:1.5}
    textarea:focus,input:focus{border-color:var(--primary)}
    textarea::placeholder,input::placeholder{color:var(--muted)}
    .save-button,.backup-button{display:block;width:100%;margin-top:12px;padding:15px;border:0;border-radius:14px;background:var(--primary);color:#fff;font-size:17px;font-weight:bold;cursor:pointer}
    .save-button:active,.backup-button:active{background:var(--primary-dark);transform:scale(.98)}
    .cancel-button{display:none;width:100%;margin-top:8px;padding:12px;border:1px solid var(--border);border-radius:12px;background:transparent;color:var(--text);font-size:15px;font-weight:bold}
    .search{display:block;width:100%;margin-top:18px;padding:14px 15px;border:1px solid var(--border);border-radius:14px;outline:0;background:var(--input-bg);color:var(--text);font-size:16px}
    .tools{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.backup-button{margin:0;font-size:14px;padding:12px}
    .backup-button.secondary{background:var(--card);color:var(--text);border:1px solid var(--border)}
    .top-info{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:15px;padding:0 2px;color:var(--muted);font-size:14px}
    .counter{font-weight:bold;color:var(--text)}.clear-all{border:0;padding:5px;background:transparent;color:var(--danger);font-size:14px;cursor:pointer}
    .notes{margin-top:15px}.note{background:var(--card);padding:16px;margin-bottom:14px;border-radius:14px;box-shadow:var(--shadow);border:1px solid transparent;animation:showNote .15s ease}
    @keyframes showNote{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
    .note-text{white-space:pre-wrap;overflow-wrap:anywhere;word-break:break-word;font-size:17px;line-height:1.55}.date{margin-top:10px;color:var(--muted);font-size:12px;line-height:1.4}
    .actions{display:flex;gap:8px;margin-top:12px}.actions button{flex:1;min-height:42px;border:0;border-radius:10px;color:#fff;font-size:14px;font-weight:bold;cursor:pointer}.edit{background:var(--edit)}.delete{background:var(--danger)}
    .empty{text-align:center;color:var(--muted);padding:35px 10px;font-size:15px}
    @media(max-width:480px){header h1{font-size:23px}.container{padding:15px 12px 30px}textarea{min-height:140px;font-size:16px}.note-text{font-size:16px}.top-info{font-size:13px}}
  </style>
</head>
<body>
<header>
  <h1>📒 Yon Daftar</h1>
  <button class="theme-button" id="themeButton" type="button" aria-label="Rejimni almashtirish">🌙</button>
</header>

<main class="container">
  <textarea id="noteInput" placeholder="Bu yerga yozing..." autocomplete="off" spellcheck="true"></textarea>
  <button class="save-button" id="saveButton" type="button">💾 Saqlash</button>
  <button class="cancel-button" id="cancelButton" type="button">✖️ Bekor qilish</button>

  <input class="search" id="searchInput" type="search" placeholder="🔍 Daftardan qidiring..." autocomplete="off">

  <div class="tools">
    <button class="backup-button" id="exportButton" type="button">📤 Zaxira olish</button>
    <button class="backup-button secondary" id="importButton" type="button">📥 Zaxirani tiklash</button>
  </div>
  <input id="fileInput" type="file" accept=".json,application/json" hidden>

  <div class="top-info">
    <div>Jami: <span class="counter" id="counter">0</span> ta yozuv</div>
    <button class="clear-all" id="clearAllButton" type="button">🗑 Hammasini o‘chirish</button>
  </div>
  <div class="notes" id="notes"></div>
</main>

<script>
"use strict";

const STORAGE_KEY="yonDaftar_notes_v3";
const THEME_KEY="yonDaftar_theme_v1";

const noteInput=document.getElementById("noteInput");
const saveButton=document.getElementById("saveButton");
const cancelButton=document.getElementById("cancelButton");
const searchInput=document.getElementById("searchInput");
const notesContainer=document.getElementById("notes");
const counter=document.getElementById("counter");
const clearAllButton=document.getElementById("clearAllButton");
const themeButton=document.getElementById("themeButton");
const exportButton=document.getElementById("exportButton");
const importButton=document.getElementById("importButton");
const fileInput=document.getElementById("fileInput");

let notes=[];
let editingId=null;

function createId(){
  return Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,10);
}

function loadNotes(){
  try{
    const saved=localStorage.getItem(STORAGE_KEY);
    if(!saved){notes=[]; return;}
    const data=JSON.parse(saved);
    if(!Array.isArray(data)){notes=[]; return;}
    notes=data.filter(x=>x&&typeof x.text==="string").map(x=>({
      id:typeof x.id==="string"?x.id:createId(),
      text:x.text,
      createdAt:x.createdAt||new Date().toISOString(),
      updatedAt:x.updatedAt||null
    }));
  }catch(e){
    console.error(e);
    notes=[];
    alert("Yozuvlarni o‘qishda xatolik yuz berdi.");
  }
}

function saveNotes(){
  try{
    localStorage.setItem(STORAGE_KEY,JSON.stringify(notes));
    return true;
  }catch(e){
    console.error(e);
    alert("Saqlab bo‘lmadi. Telefon xotirasini tekshiring.");
    return false;
  }
}

function formatDate(value){
  const d=new Date(value);
  if(Number.isNaN(d.getTime())) return "";
  try{return d.toLocaleString("uz-UZ",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});}
  catch(e){return d.toLocaleString();}
}

function saveNote(){
  const text=noteInput.value.trim();
  if(!text){alert("Avval biror narsa yozing!");noteInput.focus();return;}

  if(editingId!==null){
    const note=notes.find(x=>x.id===editingId);
    if(!note){cancelEditing();return;}
    note.text=text;
    note.updatedAt=new Date().toISOString();
  }else{
    notes.unshift({id:createId(),text,createdAt:new Date().toISOString(),updatedAt:null});
  }

  if(saveNotes()){
    noteInput.value="";
    cancelEditing();
    renderNotes();
    noteInput.focus();
  }
}

function editNote(id){
  const note=notes.find(x=>x.id===id);
  if(!note)return;
  noteInput.value=note.text;
  editingId=id;
  saveButton.textContent="✏️ O‘zgarishni saqlash";
  cancelButton.style.display="block";
  noteInput.focus();
  window.scrollTo({top:0,behavior:"smooth"});
}

function cancelEditing(){
  editingId=null;
  noteInput.value="";
  saveButton.textContent="💾 Saqlash";
  cancelButton.style.display="none";
}

function deleteNote(id){
  const note=notes.find(x=>x.id===id);
  if(!note)return;
  if(!confirm("Bu yozuvni o‘chirmoqchimisiz?"))return;
  notes=notes.filter(x=>x.id!==id);
  if(editingId===id)cancelEditing();
  saveNotes();
  renderNotes();
}

function clearAllNotes(){
  if(!notes.length){alert("O‘chirish uchun yozuv yo‘q.");return;}
  if(!confirm("Barcha yozuvlarni o‘chirmoqchimisiz?\n\nBu amalni qaytarib bo‘lmaydi."))return;
  notes=[];
  cancelEditing();
  saveNotes();
  renderNotes();
}

function normalizeText(text){
  return String(text).toLocaleLowerCase("uz-UZ").trim();
}

function renderNotes(){
  const q=normalizeText(searchInput.value);
  const filtered=notes.filter(n=>normalizeText(n.text).includes(q));
  counter.textContent=notes.length; // umumiy son
  notesContainer.innerHTML="";

  if(!filtered.length){
    const empty=document.createElement("div");
    empty.className="empty";
    empty.textContent=q?"🔍 Bunday yozuv topilmadi.":"📒 Hozircha yozuv yo‘q.";
    notesContainer.appendChild(empty);
    return;
  }

  filtered.forEach(note=>{
    const el=document.createElement("div");el.className="note";
    const text=document.createElement("div");text.className="note-text";text.textContent=note.text;
    const date=document.createElement("div");date.className="date";
    date.textContent="🕒 "+(note.updatedAt?formatDate(note.updatedAt)+" · tahrirlangan":formatDate(note.createdAt));

    const actions=document.createElement("div");actions.className="actions";
    const edit=document.createElement("button");edit.className="edit";edit.type="button";edit.textContent="✏️ Tahrirlash";edit.onclick=()=>editNote(note.id);
    const del=document.createElement("button");del.className="delete";del.type="button";del.textContent="🗑 O‘chirish";del.onclick=()=>deleteNote(note.id);
    actions.append(edit,del);
    el.append(text,date,actions);
    notesContainer.appendChild(el);
  });
}

function loadTheme(){
  try{if(localStorage.getItem(THEME_KEY)==="dark")document.body.classList.add("dark");}catch(e){}
  updateThemeButton();
}

function updateThemeButton(){
  themeButton.textContent=document.body.classList.contains("dark")?"☀️":"🌙";
}

function toggleTheme(){
  const dark=document.body.classList.toggle("dark");
  try{localStorage.setItem(THEME_KEY,dark?"dark":"light");}catch(e){}
  updateThemeButton();
}

function exportBackup(){
  const backup={
    app:"Yon Daftar",
    version:1,
    exportedAt:new Date().toISOString(),
    notes:notes
  };
  const blob=new Blob([JSON.stringify(backup,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download="yon-daftar-backup-"+new Date().toISOString().slice(0,10)+".json";
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function importBackupFile(file){
  if(!file)return;
  const reader=new FileReader();
  reader.onload=function(){
    try{
      const data=JSON.parse(reader.result);
      const imported=Array.isArray(data)?data:data.notes;
      if(!Array.isArray(imported))throw new Error("Noto‘g‘ri backup");
      const clean=imported.filter(x=>x&&typeof x.text==="string").map(x=>({
        id:typeof x.id==="string"?x.id:createId(),
        text:x.text,
        createdAt:x.createdAt||new Date().toISOString(),
        updatedAt:x.updatedAt||null
      }));
      if(!confirm("Mavjud yozuvlar o‘rniga backupdagi "+clean.length+" ta yozuv tiklansinmi?"))return;
      notes=clean;
      cancelEditing();
      if(saveNotes()){renderNotes();alert("Backup muvaffaqiyatli tiklandi.");}
    }catch(e){
      alert("Backup fayli noto‘g‘ri yoki buzilgan.");
    }finally{fileInput.value="";}
  };
  reader.readAsText(file);
}

saveButton.addEventListener("click",saveNote);
cancelButton.addEventListener("click",cancelEditing);
searchInput.addEventListener("input",renderNotes);
themeButton.addEventListener("click",toggleTheme);
clearAllButton.addEventListener("click",clearAllNotes);
exportButton.addEventListener("click",exportBackup);
importButton.addEventListener("click",()=>fileInput.click());
fileInput.addEventListener("change",()=>importBackupFile(fileInput.files[0]));

noteInput.addEventListener("keydown",e=>{
  if(e.ctrlKey&&e.key==="Enter"){e.preventDefault();saveNote();}
  if(e.key==="Escape"&&editingId!==null)cancelEditing();
});

loadNotes();
loadTheme();
renderNotes();
</script>
  <script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js");
  });
}
  </script>
</body>
</html>
