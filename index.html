<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

      <title>Yon Daftar</title>

        <style>
            * {
                  box-sizing: border-box;
                      }

                          body {
                                margin: 0;
                                      font-family: Arial, sans-serif;
                                            background: #f4f6f8;
                                                  color: #222;
                                                      }

                                                          header {
                                                                background: #1976d2;
                                                                      color: white;
                                                                            padding: 22px 15px;
                                                                                  text-align: center;
                                                                                      }

                                                                                          header h1 {
                                                                                                margin: 0;
                                                                                                      font-size: 28px;
                                                                                                          }

                                                                                                              .container {
                                                                                                                    max-width: 650px;
                                                                                                                          margin: auto;
                                                                                                                                padding: 20px;
                                                                                                                                    }

                                                                                                                                        textarea {
                                                                                                                                              width: 100%;
                                                                                                                                                    height: 160px;
                                                                                                                                                          padding: 15px;
                                                                                                                                                                border: 1px solid #ccc;
                                                                                                                                                                      border-radius: 14px;
                                                                                                                                                                            resize: vertical;
                                                                                                                                                                                  outline: none;
                                                                                                                                                                                        font-size: 17px;
                                                                                                                                                                                              font-family: Arial, sans-serif;
                                                                                                                                                                                                    background: white;
                                                                                                                                                                                                        }

                                                                                                                                                                                                            textarea:focus {
                                                                                                                                                                                                                  border-color: #1976d2;
                                                                                                                                                                                                                      }

                                                                                                                                                                                                                          .save-button {
                                                                                                                                                                                                                                width: 100%;
                                                                                                                                                                                                                                      margin-top: 12px;
                                                                                                                                                                                                                                            padding: 15px;
                                                                                                                                                                                                                                                  border: none;
                                                                                                                                                                                                                                                        border-radius: 14px;
                                                                                                                                                                                                                                                              background: #1976d2;
                                                                                                                                                                                                                                                                    color: white;
                                                                                                                                                                                                                                                                          font-size: 18px;
                                                                                                                                                                                                                                                                                font-weight: bold;
                                                                                                                                                                                                                                                                                      cursor: pointer;
                                                                                                                                                                                                                                                                                          }

                                                                                                                                                                                                                                                                                              .save-button:active {
                                                                                                                                                                                                                                                                                                    transform: scale(0.98);
                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                            .search {
                                                                                                                                                                                                                                                                                                                  width: 100%;
                                                                                                                                                                                                                                                                                                                        margin-top: 20px;
                                                                                                                                                                                                                                                                                                                              padding: 14px;
                                                                                                                                                                                                                                                                                                                                    border: 1px solid #ccc;
                                                                                                                                                                                                                                                                                                                                          border-radius: 14px;
                                                                                                                                                                                                                                                                                                                                                font-size: 16px;
                                                                                                                                                                                                                                                                                                                                                      outline: none;
                                                                                                                                                                                                                                                                                                                                                          }

                                                                                                                                                                                                                                                                                                                                                              .notes {
                                                                                                                                                                                                                                                                                                                                                                    margin-top: 20px;
                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                            .note {
                                                                                                                                                                                                                                                                                                                                                                                  background: white;
                                                                                                                                                                                                                                                                                                                                                                                        padding: 16px;
                                                                                                                                                                                                                                                                                                                                                                                              margin-bottom: 14px;
                                                                                                                                                                                                                                                                                                                                                                                                    border-radius: 14px;
                                                                                                                                                                                                                                                                                                                                                                                                          box-shadow: 0 2px 8px rgba(0,0,0,0.08);
                                                                                                                                                                                                                                                                                                                                                                                                              }

                                                                                                                                                                                                                                                                                                                                                                                                                  .note-text {
                                                                                                                                                                                                                                                                                                                                                                                                                        white-space: pre-wrap;
                                                                                                                                                                                                                                                                                                                                                                                                                              word-wrap: break-word;
                                                                                                                                                                                                                                                                                                                                                                                                                                    font-size: 17px;
                                                                                                                                                                                                                                                                                                                                                                                                                                          line-height: 1.5;
                                                                                                                                                                                                                                                                                                                                                                                                                                              }

                                                                                                                                                                                                                                                                                                                                                                                                                                                  .date {
                                                                                                                                                                                                                                                                                                                                                                                                                                                        margin-top: 10px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                              font-size: 12px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                    color: #777;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                        }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                            .delete {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  width: 100%;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        margin-top: 12px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              padding: 10px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    border: none;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          border-radius: 10px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                background: #e53935;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      color: white;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            font-size: 14px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  cursor: pointer;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          .empty {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                text-align: center;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      color: #777;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            padding: 30px 10px;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </style>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  </head>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <body>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <header>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <h1>📒 Yon Daftar</h1>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          </header>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <div class="container">

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                <textarea
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      id="noteInput"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            placeholder="Bu yerga yozing..."
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                ></textarea>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    <button class="save-button" onclick="addNote()">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          💾 Saqlash
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              </button>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  <input
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        class="search"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              id="searchInput"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    type="text"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          placeholder="🔍 Daftardan qidiring..."
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                oninput="showNotes()"
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    >

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        <div class="notes" id="notes"></div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          </div>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            <script>

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                let notes = JSON.parse(
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      localStorage.getItem("yonDaftar")
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          ) || [];


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              function saveNotes() {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    localStorage.setItem(
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            "yonDaftar",
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    JSON.stringify(notes)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          );
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  function addNote() {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const input = document.getElementById("noteInput");

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              const text = input.value.trim();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    if (text === "") {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            alert("Avval biror narsa yozing!");
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                const note = {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        text: text,
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                date: new Date().toLocaleString("uz-UZ")
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      };

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            notes.unshift(note);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  saveNotes();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        input.value = "";

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              showNotes();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      function deleteNote(index) {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            if (!confirm("Bu yozuvni o‘chirmoqchimisiz?")) {
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    return;
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          }

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                notes.splice(index, 1);

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      saveNotes();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                            showNotes();
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                }


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    function showNotes() {

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          const notesDiv =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  document.getElementById("notes");

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        const searchInput =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                document.getElementById("searchInput");

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                      const searchText =
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              searchInput.value.toLowerCase();

                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    notesDiv.innerHTML = "";


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                          const filteredNotes = notes.filter(note =>
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                  note.text.toLowerCase().includes(searchText)
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        );


                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                              if (filteredNotes.length === 0) {
